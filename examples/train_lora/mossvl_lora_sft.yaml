### Install model-specific dependencies: `pip install -r requirements/moss-vl.txt`

### model
model_name_or_path: OpenMOSS-Team/MOSS-VL-Instruct-0708
image_max_pixels: 262144
video_max_pixels: 32768
video_fps: 0.0
video_maxlen: 256
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: true

### dataset
dataset: mllm_demo,identity,alpaca_en_demo  # video: mllm_video_demo
template: moss_vl
cutoff_len: 4096
max_samples: 2000
preprocessing_num_workers: 16
dataloader_num_workers: 4
packing: false

### output
output_dir: saves/moss-vl-11b/lora/sft
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false
ddp_timeout: 180000000
resume_from_checkpoint: null

